version: "3.8"

services:
    # Service for Laravel App (PHP-FPM)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: idgrow_test_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        networks:
            - idgrow-test

    # Service for Web Server (Nginx)
    nginx:
        image: nginx:alpine
        container_name: idgrow_test_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - idgrow-test

    # Service for Database (MySQL)
    db:
        image: mysql:8.0
        container_name: idgrow_test_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: idgrow_test
            MYSQL_ROOT_PASSWORD: idgrow_root
            MYSQL_PASSWORD: idgrow_user
            MYSQL_USER: idgrow
        volumes:
            - ./docker/dbdata:/var/lib/mysql
        ports:
            - "33061:3306"
        networks:
            - idgrow-test

networks:
    idgrow-test:
        driver: bridge
